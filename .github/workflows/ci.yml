name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# macOS runners bill at 10x on a private repo against a 2,000 min/month
# allowance — roughly 840 minutes went in a single day before this was added.
# A superseded run is wasted money, so cancel it. Never cancel on master: a
# green tick there is the record that a commit was verified.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    # macOS is not a preference: the helper is Swift against ScreenCaptureKit,
    # and the transform's sinks need a Chrome with H.264 (WebCodecs).
    runs-on: macos-15
    # Must clear scripts/gate-bounds.mjs's worstCaseJobMs() with margin, which
    # transform/test/gate-bounds.test.ts asserts. 30 -> 45 -> 55 -> 65 as the
    # model stopped under-counting: first the retry (#39), then the readiness
    # wait, now the GC-retry path that was previously absorbed by margin and
    # named in a comment.
    #
    # Rising is not a regression here. Every gate now carries its OWN process
    # bound, so a wedged gate dies at 7.5-13 min instead of holding the job to
    # this cap — the seek gate that held one for 17.5 minutes on 2026-08-28
    # would now be killed at 7.5. This cap is a BACKSTOP behind four tighter
    # bounds rather than the thing that catches a wedge, which is exactly why it
    # can afford to state the worst case honestly instead of optimistically.
    # Minutes are free on a public repo; a healthy run is ~6 min.
    timeout-minutes: 70

    # A post-merge master run re-verifies a tree CI already approved as a PR
    # head, which is the largest remaining duplication. It is NOT skipped by
    # matching commit messages: a direct push whose message happened to contain
    # "(#" would be silently unverified, and nothing would notice. Paying twice
    # beats not checking at all. Remove the master push trigger if the
    # duplication ever outweighs the record.

    steps:
      # Node 24 runtimes (`runs.using: node24`). Node 20 is deprecated on the
      # runners and was already being force-run on 24, which is a warning today
      # and a hard failure whenever the runners drop the shim. These are the
      # LOWEST majors that actually run node24 — see the artifact step for why
      # that is worth stating rather than aligning everything on one number.
      - uses: actions/checkout@v5

      # The runtime the SUITE runs on — distinct from the actions' own node24
      # runtimes above, which is what the deprecation warning was about. 24 is
      # the active LTS; this machine develops on 26, so 22 was the one version
      # nobody actually used. Verified before landing: 195 tests, typecheck and
      # all four gates green on a stock v24.20.0.
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show toolchain
        run: |
          swift --version
          xcrun --show-sdk-path
          node --version

      # A non-zero exit must fail the job: swiftc leaves the PREVIOUS binary in
      # place on failure, so an unchecked build silently tests stale code.
      - name: Build helper
        run: ./helper/build.sh

      # Three passes, not one: a coverage pass over every .ts file, then two
      # narrowed passes that ban DOM globals in the Electron main process and
      # node globals in the renderer/transform. `npx tsc --noEmit` alone runs
      # only the first.
      - name: Typecheck
        run: npm run typecheck

      # Everything that runs anywhere. Excludes *.grant.test.ts (needs a Screen
      # Recording grant, which no CI runner can give) and *.slow.test.ts.
      - name: Test
        run: npm test

      # Real Chrome, not bundled Chromium: the bundled build lacks H.264, and
      # every sink in this project is H.264 end to end.
      # test:slow is the cross-implementation check — a UI export and a CLI
      # export of the same take must agree byte-for-byte before the encoder. It
      # has caught two real divergences (the trim/project defect, and the
      # project-defaults one) and until now it ran nowhere automatically,
      # because it reached into ~/Desktop/stc for a take and threw when CI had
      # none. It uses the committed fixture now.
      #
      # Before the gates on purpose: a correctness divergence should surface in
      # ~2 min rather than after 20 minutes of video pipeline. The bound is
      # SLOW_TESTS_MS in scripts/gate-bounds.mjs, which the worst-case model
      # counts and gate-bounds.test.ts asserts against this number.
      # NAMED, not the whole suite. helper/test/ring-overflow.slow.test.ts is
      # machine-dependent BY CONSTRUCTION — how long a consumer must stall
      # before the kernel's pipe overflows is the kernel's business, so it
      # escalates 2s, 4s, 8s… until drops appear. Its own file comment already
      # recorded that it "timed out on CI at 180 s", which is exactly why it
      # lived outside CI; #54 then put the whole suite in and dragged it along.
      # It passed three runs and timed out on the fourth, which is worse than
      # failing consistently: it reddens PRs at random.
      #
      # So CI runs the check it was actually added for, and the pipe-dependent
      # one stays a local command. That is a real gap and is stated as one in
      # docs/STC-259-GATE-SKIP-RATE.md rather than hidden behind a green tick.
      - name: Cross-implementation export identity (test:slow)
        timeout-minutes: 12
        run: npm run test:slow -- app/test/export-identity.slow.test.ts

      - name: Install Chrome
        run: npx playwright install chrome

      - name: Determinism gate (fixture)
        run: npm run gate

      - name: Seek gate (fixture)
        run: npm run gate:seek

      # Gates that need a recorded session build one from the committed fixture,
      # since CI has no screen to record and no grant to record it with.
      - name: Export and identity gates (fixture session)
        run: |
          TAKE="$(mktemp -d)/2026-01-01_00-00-00"
          mkdir -p "$TAKE"
          cp fixtures/basic/anchors.json fixtures/basic/events.json fixtures/basic/display.mp4 "$TAKE/"
          npm run gate:export -- "$TAKE"
          # The identity gate runs on the CAMERA fixture, not the camera-less
          # one. It is a strict superset — every sink-identity assertion still
          # runs, plus the PiP ones — so this costs no extra job budget and is
          # the only place PiP correctness is gated in CI at all.
          #
          # project.json is deliberately NOT copied. A take recorded by the app
          # has none until it is edited, so the gate must exercise the path
          # where the project is DEFAULTED from the anchors. That path was
          # broken: harness/sink-identity.ts assembled a project literal with no
          # `pip`, and every camera take without a project.json rendered without
          # a PiP. The camera-less fixture could never have caught it.
          CAM="$(mktemp -d)/2026-01-01_00-00-00"
          mkdir -p "$CAM"
          cp fixtures/pip/anchors.json fixtures/pip/events.json \
             fixtures/pip/display.mp4 fixtures/pip/camera.mp4 "$CAM/"
          npm run gate:identity -- "$CAM"

      # The decorated still (STC-291). Asserts PROPERTIES of the rendered
      # pixels — alpha zero outside the window's real shape, no dark fringe on
      # the corner curve, a shadow that decreases to zero, a background with no
      # holes — rather than comparing against golden images, which would be a
      # stored constant across rasterisers that this project does not control
      # (CLAUDE.md, the rasterization-backend trap).
      #
      # Needs no session and decodes no video, so it is the one gate with no
      # VideoDecoder.configure() to wedge on and nothing for STC-259 to skip.
      - name: Decorated still gate
        run: npm run gate:still

      # The helper has crashed three times on CI and each time produced only a
      # signal number (STC-254). The stack trace lives in the OS crash report,
      # which is discarded with the runner unless collected here.
      - name: Collect crash reports
        if: failure()
        run: |
          mkdir -p crash-reports
          for d in ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports; do
            [ -d "$d" ] || continue
            find "$d" -name "stc-helper*" -o -name "Electron*" 2>/dev/null \
              | while read -r f; do cp "$f" crash-reports/ 2>/dev/null || true; done
          done
          echo "collected $(ls crash-reports 2>/dev/null | wc -l | tr -d ' ') report(s)"
          ls -la crash-reports 2>/dev/null || true

      - name: Upload failure artifacts
        if: failure()
        # v6, not v5: upload-artifact@v5 announced node24 support but still
        # declares `using: node20`, so aligning this on v5 with the two above
        # would look tidy and quietly keep the deprecated runtime. v6 is the
        # first major that actually runs on node24.
        uses: actions/upload-artifact@v6
        with:
          name: failure-logs
          path: |
            crash-reports/
            helper/build/
            app/dist/
          retention-days: 5
          if-no-files-found: ignore
