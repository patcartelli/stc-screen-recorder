<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:">
  <title>capture</title>
  <style>
    :root { color-scheme: light dark; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: transparent; overflow: hidden;
      font: 12px/1.4 -apple-system, system-ui, sans-serif;
    }
    /*
      The window itself is transparent and borderless (STC-296) — everything
      that reads as "a panel" is this card's own background and shadow, so it
      can sit in a screen corner with rounded corners and a soft edge rather
      than a rectangular OS window.
    */
    #card {
      position: absolute; inset: 8px;
      border-radius: 14px;
      background: rgba(30, 30, 32, 0.82);
      color: #f2f2f2;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
      display: flex; flex-direction: column;
      overflow: hidden;
      opacity: 0; transform: scale(0.92);
      transition: opacity 160ms ease-out, transform 160ms ease-out;
      cursor: pointer;
    }
    #card.in { opacity: 1; transform: scale(1); }
    #card.expanded { cursor: default; }
    #thumbwrap {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 10px 10px 0;
      min-height: 0;
    }
    #thumbcanvas { max-width: 100%; max-height: 100%; display: block; border-radius: 6px; }
    #expanded { display: none; padding: 8px 10px 10px; }
    #card.expanded #expanded { display: block; }
    .row { display: flex; align-items: center; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
    select, button {
      font: inherit; color: inherit; background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 6px;
      padding: 4px 8px; cursor: pointer;
    }
    button:hover { background: rgba(255, 255, 255, 0.2); }
    button:disabled { opacity: 0.4; cursor: default; }
    button:disabled:hover { background: rgba(255, 255, 255, 0.12); }
    #close { margin-left: auto; padding: 4px 9px; }
    #status { opacity: 0.75; margin-top: 4px; min-height: 1.2em; }
    /* redact mode (STC-297): the panel grows so a box can be placed over a
       line of text rather than over a fifth of the screenshot. */
    #redactrow { display: none; }
    #card.redacting #redactrow { display: flex; }
    #card.redacting #redact { background: rgba(255, 255, 255, 0.28); }
    #card.redacting #thumbcanvas { cursor: crosshair; }
    #redacthint { opacity: 0.7; }
  </style>
</head>
<body>
  <div id="card">
    <div id="thumbwrap"><canvas id="thumbcanvas"></canvas></div>
    <div id="expanded">
      <div class="row">
        <label>Style <select id="mode"></select></label>
      </div>
      <div class="row">
        <button id="redact" title="Cover anything private with a solid fill">Redact</button>
        <button id="copy">Copy</button>
        <button id="save">Save</button>
        <button id="close" title="Close">✕</button>
      </div>
      <div class="row" id="redactrow">
        <span id="redacthint">Drag over anything private.</span>
        <button id="undo" title="Remove the last box">Undo</button>
        <button id="donedact">Done</button>
      </div>
      <div id="status"></div>
    </div>
  </div>
  <script src="../dist/thumbnail-renderer.js"></script>
</body>
</html>
