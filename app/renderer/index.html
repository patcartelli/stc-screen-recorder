<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:">
  <title>stc recorder</title>
  <style>
    :root { color-scheme: light dark; font: 13px/1.5 -apple-system, system-ui, sans-serif; }
    body { margin: 0; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    h1 { font-size: 15px; font-weight: 600; margin: 0; }
    button { font: inherit; padding: 8px 18px; border-radius: 7px; border: 1px solid rgba(128,128,128,.4); background: transparent; cursor: pointer; }
    button[disabled] { opacity: .4; cursor: default; }
    #record { font-weight: 600; }
    .row { display: flex; gap: 10px; align-items: center; }
    #state { font-variant-numeric: tabular-nums; opacity: .75; }
    table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
    td { padding: 2px 14px 2px 0; }
    td:first-child { opacity: .6; }
    #alert { padding: 10px 12px; border-radius: 7px; border: 1px solid rgba(200,80,60,.5);
             background: rgba(200,80,60,.1); display: none; white-space: pre-wrap; }
    #alert.show { display: block; }
    h2 { font-size: 13px; font-weight: 600; margin: 4px 0 0; opacity: .7; }
    .take { display: flex; justify-content: space-between; gap: 12px; align-items: baseline;
            padding: 7px 0; border-top: 1px solid rgba(128,128,128,.22); }
    .take .meta { opacity: .6; font-variant-numeric: tabular-nums; font-size: 12px; }
    .take button { padding: 3px 10px; font-size: 12px; }
    .broken { color: #c2553c; font-size: 12px; padding: 6px 0; }

    /* ── the library grid (STC-294) ─────────────────────────────────────── */
    .libfilters { display: flex; gap: 6px; padding: 2px 0 10px; }
    .libfilters .chip { padding: 3px 12px; font-size: 12px; border-radius: 999px; opacity: .75; }
    .libfilters .chip.on { opacity: 1; font-weight: 600;
                           border-color: rgba(128,128,128,.75);
                           background: rgba(128,128,128,.14); }
    /* auto-fill, so a narrow window reflows rather than scrolling sideways. */
    .libgrid { display: grid; gap: 14px;
               grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
    .libtile { display: flex; flex-direction: column; gap: 7px;
               border: 1px solid rgba(128,128,128,.22); border-radius: 9px;
               padding: 9px; min-width: 0; }
    /* A fixed aspect box, so the grid does not reflow as pictures land — 500
       tiles each nudging their neighbours is the jank the 60 fps criterion is
       about, and reserving the space costs nothing. */
    .libthumb { aspect-ratio: 16 / 10; border-radius: 6px; overflow: hidden;
                background: rgba(128,128,128,.13); display: flex;
                align-items: center; justify-content: center; }
    .libthumb img { max-width: 100%; max-height: 100%; display: block; }
    /* The checkerboard reads as "transparent" rather than "white", which for a
       window capture with real alpha is the difference between seeing the
       shape and thinking the shot has a white background. */
    .libthumb.empty { background-image:
        linear-gradient(45deg, rgba(128,128,128,.10) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(128,128,128,.10) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(128,128,128,.10) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(128,128,128,.10) 75%);
      background-size: 14px 14px;
      background-position: 0 0, 0 7px, 7px -7px, -7px 0; }
    .libbody { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .libbadge { align-self: flex-start; font-size: 10px; letter-spacing: .04em;
                text-transform: uppercase; padding: 1px 7px; border-radius: 999px;
                background: rgba(128,128,128,.18); opacity: .8; }
    /* Coloured from the badge's own TEXT, so this stylesheet is the only place
       that knows there are two kinds — and the view module still does not. */
    .libbadge[data-badge="Still"] { background: rgba(90,140,220,.22); }
    .libtitle { font-size: 12px; font-weight: 600; overflow: hidden;
                text-overflow: ellipsis; white-space: nowrap; }
    .libtile .meta { opacity: .6; font-size: 11px; font-variant-numeric: tabular-nums;
                     overflow: hidden; text-overflow: ellipsis; }
    .libactions { display: flex; flex-wrap: wrap; gap: 5px; margin-top: auto; }
    .libactions button { padding: 2px 9px; font-size: 11px; }
    .libactions button.delete { border-color: rgba(200,80,60,.45); }
    .libempty { opacity: .5; padding: 6px 0; }
    #empty { opacity: .5; padding: 6px 0; }
    .stamp { opacity: .45; font-size: 11px; margin-left: 6px; }
    .labelinput { font: inherit; padding: 2px 6px; border-radius: 5px;
                  border: 1px solid rgba(128,128,128,.5); background: transparent; width: 200px; }
    .take button.delete { border-color: rgba(200,80,60,.45); }
    #player[hidden] { display: none; }
    #stage { width: 100%; height: auto; background: #000; border-radius: 6px; display: block; }
    /* Viewer's eye: the canvas is DISPLAYED at the embed width, not merely
       rendered at it. `width: 100%` stretches a smaller render back to the
       player column, so small text is shown larger than a real viewer gets —
       which is the opposite of what STC-318 is for. The player scrolls rather
       than shrinking it, because shrinking it is the original lie. */
    #stage[data-vieweye] { width: var(--vieweye-w); max-width: none; }
    #player { overflow-x: auto; }
    .transport { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
    .timeline { position: relative; flex: 1; height: 28px; }
    .timeline .bar { position: absolute; left: 0; right: 0; top: 12px; height: 4px;
                     background: rgba(128,128,128,.28); border-radius: 2px; pointer-events: none; }
    .timeline .kept { position: absolute; top: 0; height: 4px;
                      background: rgba(128,128,128,.9); border-radius: 2px; }
    /* STC-338 rule 9: the export grid, drawn only at a stride wide enough to
       read. The stride comes from `tickStrideFrames`, as a pixel period on a
       repeating gradient — a DOM node per tick would be thousands of elements
       on a minute-long take for something that is one line of paint. Hidden
       outright when no stride clears the floor, which is the honest answer at
       that density rather than a grey smear. */
    .timeline .ticks { position: absolute; left: 0; right: 0; top: 8px; height: 12px;
                       pointer-events: none; opacity: .5;
                       background-image: repeating-linear-gradient(to right,
                         currentColor 0 1px, transparent 1px var(--tick-px, 12px));
                       -webkit-mask-image: linear-gradient(to bottom, #000 0 4px, transparent 4px);
                       mask-image: linear-gradient(to bottom, #000 0 4px, transparent 4px); }
    .timeline .ticks[hidden] { display: none; }
    /* Rule 4: the material outside in/out is DIMMED, never made unreachable —
       you have to be able to scrub into what you cut to know the cut is right. */
    .timeline .cut { position: absolute; top: 10px; height: 8px; pointer-events: none;
                     background: repeating-linear-gradient(-45deg,
                       rgba(128,128,128,.30) 0 2px, transparent 2px 5px); }
    .timeline .handle { position: absolute; top: 4px; width: 10px; height: 20px;
                        margin-left: -5px; padding: 0; border-radius: 2px; z-index: 3;
                        cursor: ew-resize; background: currentColor;
                        transition: transform .12s ease, background-color .12s ease; }
    .timeline .handle.in { border-radius: 2px 0 0 2px; }
    .timeline .handle.out { border-radius: 0 2px 2px 0; }
    /* Rule 5: the clamp is FELT. While the pointer pulls past the limit the
       handle stays behind it, wider and warmer; releasing drops `held` and the
       transition above is the settle. A handle that just stopped dead would
       look like one that had lost the pointer. */
    .timeline .handle.held { background: #b34; transform: scaleX(1.6); }
    .timeline .handle:focus-visible { outline: 2px solid #58f; outline-offset: 2px; }
    .timeline #scrub { position: absolute; left: 0; right: 0; width: 100%; top: 0;
                       height: 28px; margin: 0; background: none; z-index: 2;
                       -webkit-appearance: none; appearance: none; }
    .timeline #scrub::-webkit-slider-runnable-track { height: 4px; background: transparent; }
    .timeline #scrub::-webkit-slider-thumb { -webkit-appearance: none; appearance: none;
                       width: 3px; height: 20px; margin-top: -8px; border-radius: 1px;
                       background: currentColor; }
    /* Rule 3: direct, so the playhead does not animate toward the pointer.
       The only thing that grows is the grab affordance. */
    .timeline #scrub:active::-webkit-slider-thumb { height: 24px; margin-top: -10px; }
    .timeline #scrub:focus-visible { outline: 2px solid #58f; outline-offset: 2px;
                       border-radius: 3px; }
    #clock { font-variant-numeric: tabular-nums; font-size: 12px; opacity: .7;
             min-width: 132px; }
    /* Rule 7: the rate is shown while the playhead is RUNNING and blank when
       it is stopped. "1x" is information once it can also be 8x; a readout
       that were always present would be chrome. */
    #shuttle { font-variant-numeric: tabular-nums; font-size: 12px; font-weight: 600;
               min-width: 32px; opacity: .85; }
    .trimbar { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12px; }
    .trimbar button { padding: 3px 10px; font-size: 12px; }
    #triminfo { opacity: .7; font-variant-numeric: tabular-nums; }
    .sizebar { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12px; }
    .sizebar select { font-size: 12px; }
    #outsizenote { opacity: .7; }
    .legibar { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12px; flex-wrap: wrap; }
    .legibar select, .legibar input { font-size: 12px; }
    #embedwidth { width: 5.5em; }
    #textpt { width: 4em; }
    #legibility { opacity: .7; font-variant-numeric: tabular-nums; }
    #legibility.warn { opacity: 1; color: #b34; font-weight: 600; }
    #exportbar { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
    .sharebar { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    #sharestatus { font-size: 12px; opacity: .75; }
    #exportbar[hidden] { display: none; }
    .framebar { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12px; }
    .framebar button { padding: 3px 10px; font-size: 12px; }
    #framestatus { opacity: .75; font-variant-numeric: tabular-nums; }
    #framestatus[hidden] { display: none; }
    /* still capture preferences: the destination folder (STC-293) and the
       post-capture floating thumbnail (STC-296). The DECORATED still itself
       is composited and exported from the thumbnail's own window now — see
       app/renderer/thumbnail.html — so nothing here draws a preview. */
    .stillrow { display: flex; align-items: center; gap: 8px; margin-top: 6px;
                font-size: 12px; flex-wrap: wrap; }
    .stillrow label { display: flex; align-items: center; gap: 4px; }
    .stillrow button { padding: 3px 10px; font-size: 12px; }
    #stilldest { opacity: .75; overflow: hidden; text-overflow: ellipsis;
                 white-space: nowrap; max-width: 260px; direction: rtl; }
    #exportprogress { flex: 1; }
    #exportstatus { font-size: 12px; opacity: .75; min-width: 150px; font-variant-numeric: tabular-nums; }
    .shortcut { display: flex; align-items: baseline; gap: 10px; padding: 5px 0;
                border-top: 1px solid rgba(128,128,128,.22); }
    .shortcut .name { min-width: 150px; }
    .shortcut .keys { font: inherit; min-width: 88px; text-align: center; padding: 3px 10px;
                      font-size: 12px; font-variant-numeric: tabular-nums; }
    .shortcut .keys.listening { border-color: rgba(90,140,220,.9); }
    .shortcut .clear { padding: 3px 8px; font-size: 12px; }
    .shortcut .why { font-size: 12px; color: #c2553c; flex: 1; }
    .shortcut .why.ok { color: inherit; opacity: .5; }
    #shortcutfoot { display: flex; gap: 10px; align-items: baseline; padding-top: 8px; }
    #shortcutfoot button { padding: 3px 10px; font-size: 12px; }
    #shortcuthint { font-size: 12px; opacity: .55; }
  </style>
</head>
<body>
  <h1>stc recorder</h1>
  <div class="row">
    <button id="record">Record</button>
    <button id="capturestill" title="Select a region or a window and capture one frame">Capture still</button>
    <label id="camera-label"><input type="checkbox" id="camera"> Camera</label>
    <label id="display-label">Display <select id="display"><option value="">Automatic</option></select></label>
    <span id="state">starting…</span>
  </div>
  <div id="stillstatus" hidden></div>
  <div id="alert"></div>

  <h2>Still capture</h2>
  <!--
    The destination folder (STC-293) and the post-capture floating thumbnail's
    preferences (STC-296). The decorated still itself — style, redact, copy,
    save — is the thumbnail's own compact panel now (app/renderer/thumbnail.html,
    "the whole still UI in v1"); nothing here previews or exports a shot.
  -->
  <div class="stillrow">
    <span>Saving to</span>
    <span id="stilldest">beside the shot</span>
    <button id="stillchoosedest">Change…</button>
    <button id="stillcleardest">Beside the shot</button>
  </div>
  <div class="stillrow">
    <label>Panel corner <select id="thumbcorner">
      <option value="bottom-right">Bottom right</option>
      <option value="bottom-left">Bottom left</option>
      <option value="top-right">Top right</option>
      <option value="top-left">Top left</option>
    </select></label>
    <label title="Never less than 3 seconds">Closes after
      <input id="thumbtimeout" type="number" min="3" max="60" step="1" style="width:3.5em">s</label>
    <label>then <select id="thumbsettle">
      <option value="save">Save</option>
      <option value="copy">Copy</option>
    </select></label>
    <label title="Skip the panel entirely and copy every capture straight to the clipboard">
      <input type="checkbox" id="thumbskip"> Skip it — straight to clipboard</label>
  </div>
  <table>
    <tbody>
      <tr><td>helper pid</td><td id="pid">—</td></tr>
      <tr><td>helper</td><td id="alive">—</td></tr>
      <tr><td>camera</td><td id="camera-state">—</td></tr>
      <tr><td>frames</td><td id="frames">—</td></tr>
      <tr><td>dropped</td><td id="dropped">—</td></tr>
      <tr><td>events</td><td id="events">—</td></tr>
      <tr><td>cursor shapes</td><td id="cursorEvents">—</td></tr>
      <tr><td>elapsed</td><td id="elapsed">—</td></tr>
    </tbody>
  </table>
  <div id="player" hidden>
    <canvas id="stage"></canvas>
    <div class="transport">
      <button id="playpause">Play</button>
      <div class="timeline" id="timeline">
        <div class="bar"><div class="kept" id="kept"></div></div>
        <div class="cut" id="cut-head"></div>
        <div class="cut" id="cut-tail"></div>
        <div class="ticks" id="ticks" hidden></div>
        <button type="button" class="handle in" id="trim-in" aria-label="In point"></button>
        <button type="button" class="handle out" id="trim-out" aria-label="Out point"></button>
        <!--
          STC-338 rule 1: the value is an EXPORT FRAME INDEX, not a per-mille
          position and not a time. `step=1` over frames is what makes "the
          playhead is always on the export grid" the control's own arithmetic
          rather than a rounding applied afterwards — this input cannot
          express a position between two frames. `max` is set from the take's
          length when a preview opens.
        -->
        <input id="scrub" type="range" min="0" max="0" value="0" step="1"
               aria-label="Playhead">
      </div>
      <span id="clock">0:00:00 / 0:00:00</span>
      <span id="shuttle"></span>
      <button id="export">Export</button>
      <button id="closepreview">Close</button>
    </div>
    <div class="framebar">
      <button id="copyframe" title="Copy the current frame as an image (⌘⇧C)">Copy frame</button>
      <button id="saveframe" title="Save the current frame as a PNG beside the recording (⌘⇧S)">Save frame</button>
      <span id="framestatus" hidden></span>
    </div>
    <div class="trimbar">
      <button id="markin">In</button>
      <button id="markout">Out</button>
      <button id="resettrim">Full take</button>
      <span id="triminfo"></span>
    </div>
    <!--
      Export size (STC-335). Its own row rather than a field beside Export:
      it is a property of the take that persists, like the trim, not a
      parameter of one export run — and the preview redraws at the chosen
      size, so it is something you look at before pressing the button.
    -->
    <div class="sizebar">
      <label for="outsize">Export size</label>
      <select id="outsize"></select>
      <span id="outsizenote"></span>
    </div>
    <!--
      Legibility at embed width (STC-318). The take is 4K; the demo is watched
      in a column a fraction of that wide, and nobody in the category measures
      what that does to the text. Its own row under the size picker because it
      answers a different question: the size picker is about file weight, and
      this is about whether anyone can read it — the output width cancels out
      of the arithmetic entirely.
    -->
    <div class="legibar">
      <label for="embedtarget">Shown at</label>
      <select id="embedtarget"></select>
      <input id="embedwidth" type="number" min="80" max="4096" step="1" aria-label="Embed width in CSS pixels">
      <label for="textpt">Text</label>
      <input id="textpt" type="number" min="1" max="144" step="0.5" aria-label="Base text size in points">
      <label for="vieweye" title="Draw the preview at the embed width, 1:1 — what the viewer actually sees">
        <input id="vieweye" type="checkbox"> Viewer's eye
      </label>
      <span id="legibility"></span>
    </div>
    <div id="exportbar" hidden>
      <progress id="exportprogress" max="1000" value="0"></progress>
      <span id="exportstatus"></span>
      <button id="cancelexport">Cancel</button>
    </div>
    <!--
      Share (STC-242) — the last step of the loop. Deliberately a separate row
      from the export bar: exporting and publishing are different decisions,
      and a take is often exported several times before one is worth putting
      on the site.
    -->
    <div class="sharebar">
      <button id="share" title="Copy this take's export into the site folder">Share to site</button>
      <button id="sharedest">Site folder…</button>
      <button id="revealshared" title="Show the published file in Finder">Show published</button>
      <span id="sharestatus"></span>
    </div>
  </div>

  <h2>Capture shortcuts</h2>
  <div id="shortcuts"></div>
  <div id="shortcutfoot">
    <button id="resetshortcuts">Restore defaults</button>
    <label id="shutter-label" title="Play the system camera-shutter sound when a still is captured">
      <input type="checkbox" id="shuttersound" checked> Shutter sound</label>
    <span id="shortcuthint">Work with the app in the background. Click a shortcut, then press the keys.</span>
  </div>

  <h2 id="lib-heading">Recordings</h2>
  <div id="takes"></div>
  <script src="../dist/renderer.js"></script>
</body>
</html>
